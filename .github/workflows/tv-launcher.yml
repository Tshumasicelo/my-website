name: Build ASPECTS TV

on:
  push:
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/tv-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher

    env:
      # Empty unless you add the repository secrets; the Gradle build checks
      # whether the file actually exists and falls back to the debug key.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ASPECTS_KEYSTORE: ${{ github.workspace }}/tv-launcher/signing.jks
      ASPECTS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ASPECTS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ASPECTS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Safety net: the hosted image normally has these already.
      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$ASPECTS_KEYSTORE"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/aspects-tv.apk
          ls -lh out/

      - name: Remove signing key
        if: always()
        run: rm -f "$ASPECTS_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: aspects-tv-apk
          path: tv-launcher/out/aspects-tv.apk
          if-no-files-found: error

      # A single moving tag, so the download URL never changes. Paste it straight
      # into the Downloader app on the TV.
      - name: Publish to the tv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create tv-latest out/aspects-tv.apk \
            --title "ASPECTS TV - latest build" \
            --notes "Sideload APK for Android TV. Built from \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
