name: Build ASPECTS TV

on:
  push:
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/tv-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher

    env:
      # Empty unless you add the repository secrets; the Gradle build checks
      # whether the file actually exists and falls back to the debug key.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ASPECTS_KEYSTORE: ${{ github.workspace }}/tv-launcher/signing.jks
      ASPECTS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      ASPECTS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      ASPECTS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Safety net: the hosted image normally has these already.
      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Strip every whitespace character before decoding. Pasting a 3.6 KB
          # base64 blob into the secrets UI - especially on a phone - routinely
          # introduces a line break or a stray space, and GNU base64 rejects the
          # entire input the moment it meets one.
          CLEANED=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          echo "KEYSTORE_BASE64 length after cleaning: ${#CLEANED} characters"
          echo "Expected length for this keystore:     3624 characters"

          if [ "${#CLEANED}" -lt 3624 ]; then
            echo "::error::The secret is shorter than expected, so it was truncated when pasted. Re-copy the FULL single line and update the KEYSTORE_BASE64 secret."
            exit 1
          fi

          if ! printf '%s' "$CLEANED" | base64 -d > "$ASPECTS_KEYSTORE" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 even after removing whitespace. Re-copy the file contents exactly and update the secret."
            exit 1
          fi

          # Prove the bytes really are the keystore, and that the passwords and
          # alias line up, rather than discovering it three minutes later inside
          # a Gradle stack trace.
          if ! keytool -list -keystore "$ASPECTS_KEYSTORE" \
                 -storepass "$ASPECTS_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The keystore decoded but will not open. Check the KEYSTORE_PASSWORD secret."
            exit 1
          fi

          if ! keytool -list -keystore "$ASPECTS_KEYSTORE" \
                 -storepass "$ASPECTS_KEYSTORE_PASSWORD" \
                 -alias "$ASPECTS_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore opened but has no key under that alias. Check the KEY_ALIAS secret (it should be: aspectstv)."
            exit 1
          fi

          echo "Signing key restored and verified - this build will be release-signed."

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/aspects-tv.apk
          ls -lh out/

      - name: Remove signing key
        if: always()
        run: rm -f "$ASPECTS_KEYSTORE"

      - uses: actions/upload-artifact@v4
        with:
          name: aspects-tv-apk
          path: tv-launcher/out/aspects-tv.apk
          if-no-files-found: error

      # A single moving tag, so the download URL never changes. Paste it straight
      # into the Downloader app on the TV.
      - name: Publish to the tv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create tv-latest out/aspects-tv.apk \
            --title "ASPECTS TV - latest build" \
            --notes "Sideload APK for Android TV. Built from \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`."
